<!DOCTYPE html>
<html>

    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" type="text/css" href="./options.css">
    </head>

    <body>
        <form>
            <fieldset>
                <legend>Actions</legend>

                <div class="button-group">
                    <button type="button" id="generateThumbnailButton" disabled>Use snapshot of current tab as thumbnail</button>
                    <button type="button" id="loadThumbnailButton" disabled>Use custom image as thumbnail for current tab</button>
                </div>
                <input type="file" id="thumbnailFile" accept="image/*" hidden>

            </fieldset>

            <fieldset>
                <legend>Options</legend>

                <div>
                    <label for="folderSelect">Select Folder</label>
                    <select size="8" id="folderSelect"></select>
                </div>

                <div class="box-wrapper">
                    <input type="checkbox" id="confirmBookmarkDeletion">
                    <label for="confirmBookmarkDeletion">Confirm before deleting a bookmark</label>
                </div>

                <div>
                    <label for="columnCount">Number of columns</label>
                    <select id="columnCount">
                        <option>Auto</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                    </select>
                </div>

                <fieldset>
                    <legend>Background</legend>

                    <div class="box-wrapper">
                        <input type="color" id="backgroundColor">
                        <label for="backgroundColor">Color</label>
                    </div>

                    <div>
                        <label for="backgroundImageURL">Image URL</label>
                        <input type="text" id="backgroundImageURL"></input>
                        <input type="file" id="backgroundImageChooser"></input>
                    </div>

                    <fieldset>
                        <legend>Size</legend>

                        <div class="box-wrapper">
                            <input type="radio" name="backgroundSize" id="backgroundSizeAuto" value="auto">
                            <label for="backgroundSizeAuto">Use original size</label>
                        </div>

                        <div class="box-wrapper">
                            <input type="radio" name="backgroundSize" id="backgroundSizeContain"value="contain">
                            <label for="backgroundSizeContain">Scale image to be as big as possible while staying completely visible</label>
                        </div>

                        <div class="box-wrapper">
                            <input type="radio" name="backgroundSize" id="backgroundSizeCover"value="cover">
                            <label for="backgroundSizeCover">Scale image to cover the whole background</label>
                        </div>

                    </fieldset>

                </fieldset>

                <div>
                    <label for="customCSS" >Custom CSS (complementing the default one)</label>
                    <textarea id="customCSS"></textarea>
                </div>

            </fieldset>

            <fieldset>
                <legend>Import/export settings including thumbnails</legend>

                <div class="button-group">
                    <button type="button" id="importButton">Import from JSON file</button>
                    <button type="button" id="exportButton">Export to JSON file</button>
                </div>
                <input type="file" id="importFile" accept="application/json,.json" hidden>

            </fieldset>
        </form>
        <script src="./options.js"></script>
    </body>

</html>
